<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบแสดงข้อมูลครุภัณฑ์</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      background: linear-gradient(135deg, #96a5c4 0%, #b8cbff 100%);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      color: #ffffff;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-logo-wrap {
      flex-shrink: 0;
      width: 128px;
      height: 128px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #ffffff;
    }

    .header p {
      margin: 0;
      color: #dbeafe;
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--border);
    }

    .stat-card.total {
      background: #eff6ff;
      border-left-color: var(--primary);
    }

    .stat-card.active {
      background: #f0fdf4;
      border-left-color: var(--success);
    }

    .stat-card.inactive {
      background: #fef2f2;
      border-left-color: var(--danger);
    }

    .stat-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .stat-card.total .stat-value {
      color: var(--primary);
    }

    .stat-card.active .stat-value {
      color: var(--success);
    }

    .stat-card.inactive .stat-value {
      color: var(--danger);
    }

    .table-wrap {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-2);
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:hover {
      background: #fbfdff;
    }

    .status {
      font-weight: 700;
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .status.active {
      background: #dcfce7;
      color: var(--success);
    }

    .status.inactive {
      background: #fee2e2;
      color: var(--danger);
    }

    .status.unknown {
      background: #fef3c7;
      color: var(--warning);
    }

    .asset-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f9fafb;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 16px;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #bfdbfe;
    }

    .api-error {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 12px;
      font-size: 14px;
    }

    .search-panel {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 16px;
    }

    .search-debug {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .search-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-input-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 15px;
      outline: none;
    }

    .search-input-row button {
      border: none;
      background: var(--primary);
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .filter-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    .filter-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .row-clickable {
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      width: min(760px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      border: none;
      background: #f3f4f6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      color: var(--muted);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 18px;
      margin-top: 16px;
    }

    .modal-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .modal-item strong {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .modal-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    .modal-image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .modal-image-grid img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .modal-main-image-wrap {
      margin-bottom: 18px;
      text-align: center;
    }

    .modal-main-image {
      width: 100%;
      max-width: 512px;
      height: 512px;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    @media (max-width: 900px) {
      .container { padding: 16px; }
      .header { padding: 18px; }
      .table-wrap { overflow-x: auto; }
      .charts-panel { grid-template-columns: 1fr; }
    }

    .charts-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .chart-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .chart-header h3 {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chart-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chart-controls select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .type-toggles {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 999px;
    }

    .type-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .type-btn.active {
      background: var(--primary);
      color: white;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 320px;
    }

    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  </head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="header-logo-wrap">
      
          <img id="orgLogo" class="header-logo" src="logoimagess/logoAvm.png" alt="โลโก้หน่วยงาน" />

          <p></p>

    <div class="search-panel">

            </select>
            <div class="type-toggles" data-target="locationChart">
              <button type="button" class="type-btn active" data-type="pie">วงกลม</button>
              <button type="button" class="type-btn" data-type="bar">แท่ง</button>
            </div>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="locationChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <h3>จำนวนครุภัณฑ์ตามปีที่จัดซื้อ</h3>
          <div class="chart-controls">
            <div class="type-toggles" data-target="yearChart">
              <button type="button" class="type-btn active" data-type="pie">วงกลม</button>
              <button type="button" class="type-btn" data-type="bar">แท่ง</button>

          </div>
        </div>
        <div class="chart-wrap"><canvas id="yearChart"></canvas></div>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap" style="display:none;">
      <table id="assetTable">

          <tr></tr>
        </thead>
        <tbody id="assetTableBody"></tbody>
      </table>

  </div>

    function getValue(item, key) {
      return item[key] ?? '-';
    }

    function isEmptyValue(value) {
      const text = String(value ?? '').trim();
      return text === '' || text === '-';
    }

    function isEmptyAsset(item) {
      if (isEmptyValue(getValue(item, 'Asset ID'))) return true;
      return Object.entries(item).every(([key, value]) => key === 'ห้อง' || isEmptyValue(value));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;') 
        .replace(/'/g, '&#39;');
    }

    function normalizeAssets(payload) {
      if (Array.isArray(payload)) return payload.filter(Boolean);
      if (payload && typeof payload === 'object') {
        if (Array.isArray(payload.data)) return payload.data.filter(Boolean);
        if (Array.isArray(payload.rows)) return payload.rows.filter(Boolean);
        if (Array.isArray(payload.items)) return payload.items.filter(Boolean);
        if (Array.isArray(payload.result)) return payload.result.filter(Boolean);
        if (Array.isArray(payload.values)) return payload.values.filter(Boolean);
        if (Array.isArray(payload.records)) return payload.records.filter(Boolean);
      }
      return [];
    }

    function getColumns(items) {
      const allKeys = items.flatMap((item) => Object.keys(item || {}));
      const uniqueKeys = [...new Set(allKeys)];
      const columns = [...new Set([...preferredColumns.filter((key) => uniqueKeys.includes(key)), ...uniqueKeys.filter((key) => !preferredColumns.includes(key))])];
      return columns.filter((key) => !hiddenColumns.includes(key));
    }

    function getStatusClass(status) {
      const text = String(status || '').trim();
      if (/ปกติ|ใช้งาน|พร้อม|ดี|active|good/i.test(text)) return 'active';
      if (/ชำรุด|เสีย|ไม่|ยกเลิก|inactive|broken|down/i.test(text)) return 'inactive';
      return 'unknown';
    }

    function formatPrice(value) {
      const num = Number(value);
      return Number.isNaN(num) ? value : num.toLocaleString('th-TH');
    }

    function isImageColumn(key) {
      return /รูปภาพ|image|photo/i.test(key);
    }

    function parseImageUrls(value) {
      if (value === null || value === undefined) return [];
      const text = String(value).trim();
      if (!text || text === '-') return [];
      return text
        .split(/\r?\n|,|;/)
        .map((item) => item.trim())
        .filter((item) => /^https?:\/\//i.test(item));
    }

    function getPrimaryImageUrl(item, key) {
      const urls = parseImageUrls(getValue(item, key));
      return urls[0] || '';
    }

    function isStatusColumn(key) {
      return /สถานะ|status/i.test(key);
    }

    function isPriceColumn(key) {
      return /ราคา|price/i.test(key);
    }

    function createCellContent(item, key) {
      const value = getValue(item, key);
      if (isImageColumn(key)) {
        const imageUrl = getPrimaryImageUrl(item, key);
        if (imageUrl) {
          return `<img class="asset-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(getValue(item, 'รายการครุภัณฑ์'))}">`;
        }
        if (key === 'IMAGEURL') {
          return '';
        }
        return '<div style="width:80px;height:80px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#9ca3af;">ไม่มีรูป</div>';
      }

      if (isStatusColumn(key)) {
        return `<span class="status ${getStatusClass(value)}">${escapeHtml(value)}</span>`;
      }

      if (isPriceColumn(key)) {
        return escapeHtml(formatPrice(value));
      }

      return escapeHtml(value);
    }

    function renderFilterControls() {
      filterControlsEl.innerHTML = filterDefinitions.map((definition) => {
        const selectedValue = activeFilters[definition.key] || 'ทั้งหมด';
        const options = ['ทั้งหมด', ...definition.options];
        const optionHtml = options.map((option) => {
          const isSelected = option === selectedValue ? 'selected' : '';
          return `<option value="${escapeHtml(option)}" ${isSelected}>${escapeHtml(option)}</option>`;
        }).join('');

        return `
          <label class="filter-group">
            <span>${escapeHtml(definition.label)}</span>
            <select data-filter="${escapeHtml(definition.key)}">${optionHtml}</select>
          </label>
        `;
      }).join('');

      filterControlsEl.querySelectorAll('select').forEach((select) => {
        select.addEventListener('change', () => {
          const key = select.getAttribute('data-filter');
          const value = select.value;
          if (value === 'ทั้งหมด') {
            delete activeFilters[key];
          } else {
            activeFilters[key] = value;
          }
          applyFilters();
        });
      });
    }

    function matchesYearRange(value, selectedValue) {
      const rawValue = String(value).trim();
      const yearMatch = rawValue.match(/\d{4}/);
      if (!yearMatch) return false;
      const year = Number(yearMatch[0]);
      const selectedYear = Number(selectedValue);
      if (!Number.isFinite(year) || !Number.isFinite(selectedYear)) return false;
      const normalizedYear = year < 2400 ? year + 543 : year;
      const normalizedSelected = selectedYear < 2400 ? selectedYear + 543 : selectedYear;
      return normalizedYear === normalizedSelected;
    }
    

     function updateDynamicFilters() {
       const roomFilter = filterDefinitions.find((d) => d.key === 'ห้อง');
       if (roomFilter) {
         const rooms = new Set();
         allAssets.forEach((item) => {
           const room = String(getValue(item, 'ห้อง')).trim();
           if (room && room !== '-') rooms.add(room);
         });
         roomFilter.options = Array.from(rooms).sort();
         renderFilterControls();
       }
     }
    

     function applyFilters() {
      const keyword = searchInputEl.value.trim();
      const filtered = filterAssets(allAssets, keyword, activeFilters);
      
      renderSummary(filtered);
      
      try {
        renderCharts(allAssets);
      } catch (error) {
        console.error('renderCharts error:', error);
      }
      
      renderTable(filtered);
    }

     function filterAssets(items, keyword, filters = {}) {
       const normalized = keyword.trim().toLowerCase();
       const fieldMapping = {};

       return items.filter((item) => {
         const matchesKeyword = !normalized || Object.entries(item).some(([key, value]) => {
           const textValue = String(value || '').toLowerCase();
           return textValue.includes(normalized);
         });

         const matchesFilters = Object.entries(filters).every(([field, selectedValue]) => {
           if (!selectedValue || selectedValue === 'ทั้งหมด') return true;
           const mappedField = fieldMapping[field] || field;
           const itemKeys = Object.keys(item || {});
           const matchedKey = itemKeys.find((k) => String(k).trim() === mappedField) || itemKeys.find((k) => String(k).trim().toLowerCase() === mappedField.toLowerCase());
           if (!matchedKey) return true;
           const itemValue = String(getValue(item, matchedKey)).trim();
           if (!itemValue || itemValue === '-') return false;

           if (field === 'ปีที่จัดซื้อ') {
             return matchesYearRange(itemValue, selectedValue);
           }

           return itemValue === selectedValue;
         });

         return matchesKeyword && matchesFilters;
       });
     }

    function renderSummary(items) {
      const total = items.length;
      const active = items.filter((item) => {
        const s = String(getValue(item, 'สถานะการใช้งาน')).trim();
        return /ปกติ|ใช้งาน|พร้อม|ดี|active|good/i.test(s);
      }).length;
      const inactive = total - active;

      totalCountEl.textContent = total;
      activeCountEl.textContent = active;
      inactiveCountEl.textContent = inactive;
    }

    function destroyChart(instance) {
      if (instance) {
        instance.destroy();
      }
      return null;
    }

    const ROOM_ALIASES = {
      'ห้องประชุมดร.เศาวนิต': ['ห้องประชุมดร.เศาวนิต', 'ห้องประชุม ดร.เศาวนิต'], // กําหนดตําแกน่งการดึงข้อมูล = ตําแหน่งจัดเก็บครุภัณฑ์
      'ห้องประชุม 70 ปี': ['ห้องประชุม 70 ปี', 'ห้องเก็บอุปกรณ์ส่วนกลาง'],
      'ห้องประชุมสุวัจน์ 1': ['ห้องประชุมสุวัจน์ 1']
    };

    function renderCharts(items) {
      const targetRooms = [
        'ห้องประชุมดร.เศาวนิต',
        'ห้องประชุม 70 ปี',
        'ห้องประชุมสุวัจน์ 1'
      ];

      const chartsPanel = document.getElementById('chartsPanel');
      if (items.length) {
        chartsPanel.style.display = 'grid';
      } else {
        chartsPanel.style.display = 'none';
      }

      const locationDataset = buildLocationDataset(items, locationRoomMode, targetRooms);

      if (locationChartInstance) {
        locationChartInstance.destroy();
        locationChartInstance = null;
      }
      const ctxLoc = document.getElementById('locationChart').getContext('2d');
      locationChartInstance = new Chart(ctxLoc, {
        type: locationChartType,
        data: locationDataset.data,
        options: locationDataset.options
        
      });

      const yearDataset = buildYearDataset(items);

      if (yearChartInstance) {
        yearChartInstance.destroy();
        yearChartInstance = null;
      }
      const ctxYear = document.getElementById('yearChart').getContext('2d');
      yearChartInstance = new Chart(ctxYear, {
        type: yearChartType,
        data: yearDataset.data,
        options: yearDataset.options
      });
    }

    function buildLocationDataset(items, roomMode, targetRooms) {
      let labels = [];
      let data = [];
      let backgroundColor = [];

      if (roomMode === 'all') {
        const allowedLocations = new Set(targetRooms.flatMap((room) => ROOM_ALIASES[room] || [room]));
        const typeMap = new Map();
        items.forEach((item) => {
          const loc = String(getValue(item, 'สถานที่ติดตั้งจัดเก็บ')).trim();
          if (allowedLocations.has(loc)) {
            const key = String(getValue(item, 'ประเภทครุภัณฑ์')).trim() || 'ไม่ระบุ';
            typeMap.set(key, (typeMap.get(key) || 0) + 1);
          }
        });
        labels = Array.from(typeMap.keys());
        data = labels.map((k) => typeMap.get(k));
        backgroundColor = labels.map((_, i) => palette[i % palette.length]);
      } else {
        const allowedLocations = new Set(ROOM_ALIASES[roomMode] || [roomMode]);
        const roomItems = items.filter((item) =>
          allowedLocations.has(String(getValue(item, 'สถานที่ติดตั้งจัดเก็บ')).trim())
        );
        const typeMap = new Map();
        roomItems.forEach((item) => {
          const key = String(getValue(item, 'ประเภทครุภัณฑ์')).trim() || 'ไม่ระบุ';
          typeMap.set(key, (typeMap.get(key) || 0) + 1);
        });
        labels = Array.from(typeMap.keys());
        data = labels.map((k) => typeMap.get(k));
        backgroundColor = labels.map((_, i) => palette[i % palette.length]);
      }

      const baseDataset = {
        label: 'จำนวนครุภัณฑ์',
        data: data,
        backgroundColor: backgroundColor
      };

      if (locationChartType === 'bar') {
        baseDataset.borderRadius = 12;
        delete baseDataset.borderWidth;
        delete baseDataset.borderColor;
      } else {
        baseDataset.borderWidth = 2;
        baseDataset.borderColor = '#ffffff';
        delete baseDataset.borderRadius;
      }

      return {
        data: {
          labels: labels,
          datasets: [baseDataset]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, padding: 12 }
            }
          },
          scales: locationChartType === 'bar' ? {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1 }
            }
          } : undefined
        }
      };
    }

    function buildYearDataset(items) {
      const yearMap = new Map();
      items.forEach((item) => {
        const raw = String(getValue(item, 'ปีที่จัดซื้อ')).trim();
        const m = raw.match(/(25\d{2})/);
        if (m) {
          const y = m[1];
          yearMap.set(y, (yearMap.get(y) || 0) + 1);
        }
      });
      const sortedYears = Array.from(yearMap.keys()).sort();
      const yearCounts = sortedYears.map((y) => yearMap.get(y));
      const backgroundColor = sortedYears.map((_, i) => palette[i % palette.length]);

      const baseDataset = {
        label: 'จำนวนครุภัณฑ์',
        data: yearCounts,
        backgroundColor: backgroundColor
      };

      if (yearChartType === 'bar') {
        baseDataset.borderRadius = 12;
        delete baseDataset.borderWidth;
        delete baseDataset.borderColor;
      } else {
        baseDataset.borderWidth = 2;
        baseDataset.borderColor = '#ffffff';
        delete baseDataset.borderRadius;
      }

      return {
        data: {
          labels: sortedYears,
          datasets: [baseDataset]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, padding: 12 }
            }
          },
          scales: yearChartType === 'bar' ? {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1 }
            }
          } : undefined
        }
      };
    }

    function openDetailModal(item) {
      const title = getValue(item, 'รายการครุภัณฑ์') || 'รายละเอียดครุภัณฑ์';
      modalTitleEl.textContent = title;

      const mainImageUrls = parseImageUrls(getValue(item, 'IMAGEURL'));
      const imageHtml = mainImageUrls.length
        ? `<div class="modal-main-image-wrap"><img class="modal-main-image" src="${escapeHtml(mainImageUrls[0])}" alt="${escapeHtml(title)}"></div>`
        : '';

      const detailItems = Object.entries(item)
        .filter(([key]) => key !== 'IMAGEURL' && !hiddenColumns.includes(key))
        .map(([key, value]) => {
          const safeValue = String(value || '-');
          return `<div class="modal-item"><strong>${escapeHtml(key)}</strong><div>${escapeHtml(safeValue)}</div></div>`;
        });

      modalBodyEl.innerHTML = `${imageHtml}<div class="modal-grid">${detailItems.join('')}</div>`;
      detailModalEl.classList.add('show');
    }

    function closeDetailModal() {
      detailModalEl.classList.remove('show');
    }

    function renderTable(items) {
      try {
        tbodyEl.innerHTML = '';
        const columns = getColumns(items);
        tableHeaderEl.innerHTML = columns.map((key) => `<th>${escapeHtml(key)}</th>`).join('');
        if (!items.length) {
          tbodyEl.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:#6b7280;">ไม่พบข้อมูลที่ตรงกับคำค้นหา</td></tr>';
          return;
        }

        const rows = items.map((item) => {
          const cells = columns.map((key) => `<td>${createCellContent(item, key)}</td>`).join('');
          const itemJson = JSON.stringify(item).replace(/'/g, '&apos;');
          return `<tr class="row-clickable" data-item='${itemJson}'>${cells}</tr>`;
        }).join('');
        tbodyEl.innerHTML = rows;

        tbodyEl.querySelectorAll('tr.row-clickable').forEach((row) => {
          row.addEventListener('click', () => {
            try {
              const rawData = row.getAttribute('data-item') || '{}';
              const data = JSON.parse(rawData.replace(/&apos;/g, "'"));
              openDetailModal(data);
            } catch (error) {
              console.error('ไม่สามารถเปิดรายละเอียดได้', error);
            }
          });
        });
      } catch (error) {
        console.error('renderTable error:', error);
        tbodyEl.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--danger);">เกิดข้อผิดพลาดในการแสดงตาราง: ' + error.message + '</td></tr>';
      }
    }

    async function fetchFromUrl(url, room) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`เกิดข้อผิดพลาดจาก API: ${url}`);
      const data = await response.json();
      const items = normalizeAssets(data);
      return items.map((item) => ({ ...item, ห้อง: room }));
    }

    async function fetchAssets() {
      loadingEl.style.display = 'block';
      tableWrapEl.style.display = 'none';
      document.getElementById('chartsPanel').style.display = 'none';

       try {
         const results = await Promise.allSettled(
           STEIN_STORAGE_ROOMS.map((entry) => fetchFromUrl(entry.url, entry.room))
         );
         const fulfilled = results.filter((result) => result.status === 'fulfilled');
         const items = fulfilled.flatMap((result) => result.value).filter((item) => !isEmptyAsset(item));

        const errorMessages = results
          .filter((result) => result.status === 'rejected')
          .map((result) => result.reason?.message || result.reason)
          .filter(Boolean);

        if (errorMessages.length) {
          console.warn('API errors:', errorMessages);
        }

         allAssets = items;
         updateDynamicFilters();
         applyFilters();
      } catch (error) {
        console.warn('ไม่สามารถโหลดข้อมูลจาก Stein API ได้:', error);
        renderSummary([]);
        renderCharts([]);
        renderTable([]);
      } finally {
        loadingEl.style.display = 'none';
        tableWrapEl.style.display = 'block';
      }
    }

    function startAutoRefresh() {
      setInterval(fetchAssets, REFRESH_INTERVAL_MS);
    }

    searchInputEl.addEventListener('input', applyFilters);

    clearFiltersBtn.addEventListener('click', () => {
      searchInputEl.value = '';
      activeFilters = {};
      renderFilterControls();
      applyFilters();
    });

    closeModalBtn.addEventListener('click', closeDetailModal);
    detailModalEl.addEventListener('click', (event) => {
      if (event.target === detailModalEl) {
        closeDetailModal();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeDetailModal();
      }
    });

    document.getElementById('locationRoomMode').addEventListener('change', (event) => {
      locationRoomMode = event.target.value;
      if (allAssets.length) applyFilters();
    });

    document.querySelectorAll('.type-toggles').forEach((group) => {
      const targetId = group.getAttribute('data-target');
      const buttons = group.querySelectorAll('.type-btn');
      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const type = btn.getAttribute('data-type');
          buttons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          if (targetId === 'locationChart') {
            locationChartType = type;
          } else if (targetId === 'yearChart') {
            yearChartType = type;
          }
          if (allAssets.length) applyFilters();
        });
      });
    });

    renderFilterControls();
    fetchAssets();
    startAutoRefresh();
  </script>
</body>
</html>
